[Controls]
; Edit a value to change a setting.
; Use decimal Skyrim keyboard scan codes. Restart Skyrim after editing.
; In-game settings changes save here automatically.

; Apostrophe opens the editor, semicolon opens settings, and slash toggles the HUD.
ToggleEditor=40
ToggleSettings=39
ToggleGuide=53

; W, A, S, and D move the camera. Shift slows flight.
FlyForward=17
FlyBack=31
FlyLeft=30
FlyRight=32
SlowFlight=42

; Arrow keys slide the pose. Space raises it and Ctrl lowers it.
; Minus and equals turn the pose clockwise and counterclockwise.
PoseForward=200
PoseBack=208
PoseLeft=203
PoseRight=205
Raise=57
Lower=29
Clockwise=12
Counterclockwise=13

; Backslash toggles mirror mode. Comma and period undo and redo.
; Use 0 to leave any of these three actions unbound.
Mirror=43
Undo=51
Redo=52

; Left, right, and middle mouse are 256, 257, and 258.
Grab=256
Rotate=257
OpenPoser=258

; Toggle nudge mode (Left Alt).
Nudge=56

; Set UseMouseWheel to 0 to use WheelUp and WheelDown for depth and roll.
; The default alternatives are Page Up and Page Down. 0 leaves a key unbound.
UseMouseWheel=1
WheelUp=201
WheelDown=209

; Scales handle rotation, wheel roll, and whole-pose turns from 10 to 200 percent.
RotationSensitivityPercent=100

; Set any axis to 1 to reverse handle rotation from the mouse or bound keys.
InvertYaw=0
InvertPitch=0
InvertRoll=0

; Set to 1 for subtle chest movement while the pose is idle.
BreathingMovement=0

[Display]
; UI scale ranges from 75 to 200 percent.
UIScalePercent=100
; Shortcut guide position. 0 upper left, 1 upper right, 2 lower left, 3 lower right.
GuideCorner=0

[PlayerHub]
; Enable the sharing animation and skeleton refresh.
Enabled=1
; Stand up before sharing a seated pose. 0 keeps native seated posing.
DetachSeatedPose=1

; PlayerHub can skip resending an unchanged pose to players who arrive later.
; This tiny nudge crosses a rounding boundary so those players receive the pose.
; Defaults were chosen against PlayerHub 3.0.0, which rounds the torso position
; in 1/16-unit steps. Resolution is a positive whole number. The total nudge
; is limited to 1 / Resolution Skyrim units. The default 30 leaves room
; above half a step for floating-point rounding.
; It follows the camera's line of sight when possible, or uses the nearest
; axis if that keeps the nudge smaller.
; 16 allows a larger nudge. Too high a resolution can prevent some refreshes.
Resolution=30

; Whole seconds from 0 to 10. 0 disables the nudge. The No Pandora ZIP ships
; with 0 because its standalone editor does not need a PlayerHub refresh.
PeriodSeconds=3
